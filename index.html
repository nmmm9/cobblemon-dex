<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코블몬 도감</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--fg:#111;--bg:#fff;--page:#f4f4f5;--line:#e6e6e6;--muted:#666;--soft:#f5f5f5}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--fg);font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;letter-spacing:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:40px 16px 80px}
.search{position:relative;margin-bottom:40px}
.search input{width:100%;font:inherit;font-size:20px;padding:12px 0;border:0;border-bottom:1px solid var(--fg);outline:0;background:transparent;color:var(--fg)}
.search input::placeholder{color:#a8a8a8}
.drop{position:absolute;left:0;right:0;top:100%;background:var(--bg);border:1px solid var(--line);border-top:0;z-index:10;max-height:360px;overflow:auto;display:none}
.drop.on{display:block}
.drop div{padding:9px 12px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.drop div.sel,.drop div:hover{background:var(--soft)}
.drop .n{color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px}
.drop .en{color:var(--muted);font-size:13px}
.hint,.muted{color:var(--muted)}
.head{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;margin-bottom:40px}
.head img{width:140px;height:140px;object-fit:contain;flex:none;image-rendering:auto}
.head h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.head h1 small{font-size:14px;color:var(--muted);font-weight:400;margin-left:8px}
.head > div:nth-child(2){flex:1 1 280px;min-width:0}
.head-rec{flex:2 1 560px;min-width:0}
.head-rec .mu{gap:20px}
.head-rec details{margin-top:4px}
.head .num{color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:4px}
.meta{margin-top:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.meta b{font-weight:500;color:var(--fg)}
.badge{display:inline-block;font-size:12px;padding:1px 7px;border:1px solid var(--line);border-radius:3px;color:var(--muted);vertical-align:middle;margin-left:6px}
.t{display:inline-block;font-size:13px;font-weight:500;color:#fff;padding:2px 9px;border-radius:3px;line-height:1.5;margin:2px 3px 2px 0}
.t.sm{font-size:12px;padding:1px 7px}
section{margin-bottom:40px}
h2 small{font-size:13px;font-weight:400;color:var(--muted);margin-left:8px}
h2{font-size:16px;font-weight:600;color:var(--fg);margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:3px 10px;border:1px solid var(--line);border-radius:3px;cursor:pointer}
.chip.cur{background:var(--fg);color:#fff;border-color:var(--fg)}
/* evolution */
.evo{display:flex;align-items:center;gap:16px}
.node{min-width:120px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;cursor:pointer;text-align:center}
.node.cur{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.node img{display:block;width:64px;height:64px;margin:-6px auto -2px;image-rendering:pixelated}
.node .ko{font-weight:500}
.node .fm{font-size:12px;color:var(--muted)}
.node .ty{margin-top:4px}
.branches{display:flex;flex-direction:column;gap:12px}
.branch{display:flex;align-items:center;gap:16px}
.how{font-size:13px;color:var(--muted);max-width:200px;position:relative;padding-left:20px}
.how:before{content:"→";position:absolute;left:0;color:#bbb}
.evo-scroll{overflow-x:auto;padding-bottom:6px}
/* 갈래 진화: 조건 칸 너비를 맞춰 카드 줄을 세우고, 5갈래 이상(이브이)은 2열로 */
.branches:has(> .branch + .branch) > .branch > .how{flex:none;width:190px}
@media(min-width:1000px){.branches:has(> .branch:nth-child(5)){display:grid;grid-template-columns:auto auto;justify-content:start;gap:12px 40px}}
/* stats */
.stats{display:grid;grid-template-columns:52px 40px 1fr;gap:8px 14px;align-items:center;max-width:620px}
.stats .k{color:var(--muted)}
.stats .v{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--fg)}
.stats .tot{color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.stats .tot.v{color:var(--fg)}
.role{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:18px}
.role .chip{cursor:default}
.role .note{color:var(--muted);font-size:13px;margin-left:8px}
/* matchups */
.mu{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media(max-width:700px){.mu{grid-template-columns:1fr}.head{gap:16px}.head img{width:96px;height:96px}}
.mu h3{font-size:14px;font-weight:500;margin:0 0 10px}
.row{display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:start;margin-bottom:8px}
.row .m{font-variant-numeric:tabular-nums;color:var(--muted);padding-top:3px;font-size:13px;white-space:nowrap}
.lead{margin:0 0 18px;padding:10px 14px;background:var(--soft);border-radius:4px}
.vs-search{margin:0 0 16px}
.vs-search input{font-size:15px;padding:8px 0;border-bottom-color:var(--line)}
.vs-card{border:1px solid var(--fg);border-radius:4px;padding:14px 16px;margin-bottom:18px}
.vs-title{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.vs-title b{font-weight:500}
.vs-title .lnk{cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.vs-title .note{color:var(--muted);font-size:13px}
.fav{margin-left:12px;vertical-align:middle;font:inherit;font-size:13px;font-weight:400;color:var(--muted);background:none;border:1px solid var(--line);border-radius:3px;padding:3px 9px;cursor:pointer}
.fav.on{color:var(--fg);border-color:var(--fg)}
.x{margin-left:auto;font:inherit;font-size:13px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:3px;padding:3px 8px;cursor:pointer}
.row .note{color:var(--muted);font-size:13px;margin-left:4px}
.ab{padding:10px 12px;border:1px solid var(--line);border-radius:4px;margin-bottom:8px}
.ab.on{border-color:var(--fg)}
.ab-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ab-h b{font-weight:500}
.ab-h .badge{margin-left:0}
.ab-e{color:var(--muted);font-size:13px}
.ab-d{color:var(--muted);font-size:13px;margin-top:4px}
.ab-w{font-size:13px;margin-top:6px}
.desc{margin:-4px 0 12px;color:var(--muted);font-size:13px}
.row .m.bad{color:#c0392b}.row .m.good{color:#27ae60}
.sub{color:var(--muted);font-size:13px;margin:14px 0 6px}
/* moves */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--muted);text-align:left;font-size:13px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--soft);vertical-align:middle}
td.c,th.c{text-align:center}
td .en{color:var(--muted);font-size:12px;margin-left:6px}
@media(max-width:700px){td .en{display:block;margin-left:0}}
.cat{font-size:12px;color:var(--muted)}
.rec{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.rec .card{border:1px solid var(--line);border-radius:4px;padding:12px 14px}
.rec .why{font-size:12px;color:var(--muted);margin-bottom:6px}
.rec .nm{font-weight:500}
.rec .st{color:var(--muted);font-size:13px;margin-top:4px}
.opt{font-size:13px;color:var(--muted);display:flex;gap:16px;align-items:center;margin-bottom:12px}
.opt label{cursor:pointer;display:flex;gap:6px;align-items:center}
details{margin-top:10px}
summary{cursor:pointer;color:var(--muted);padding:8px 0;list-style:none}
summary::-webkit-details-marker{display:none}
summary:before{content:"+";display:inline-block;width:16px;color:#bbb}
details[open] summary:before{content:"−"}
.empty{color:var(--muted);padding:8px}
/* 상세 페이지: 섹션을 카드로 묶고, 넓은 화면에선 12칸 격자 (c4·c8·c6 = 차지하는 칸 수) */
.dex h2{font-size:18px;border:0;padding:0;margin:0 0 16px}
.dex .stats{max-width:none}
/* 폰은 카드가 없으니 바탕도 흰색. 넓은 화면은 옅은 회색 바탕 위에 흰 판(헤더·카드·탭 본문) */
@media(max-width:700px){:root{--page:#fff}.dex > section{border-top:1px solid var(--line);padding-top:24px}}
@media(min-width:701px){
  .dex{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
  .dex > section{grid-column:1 / -1;margin:0;padding:22px 24px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
  .head,#view:not(:has(.dex)){padding:24px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
  .head{margin-bottom:16px}
}
@media(min-width:1000px){
  .dex > .c4{grid-column:span 4}.dex > .c8{grid-column:span 8}.dex > .c6{grid-column:span 6}
  .dex > .top{align-self:start}
}
/* 배틀 기초 탭 */
.bt h3,.bt .lv,.bt .ref{scroll-margin-top:70px}
.guide.bt table{max-width:920px}
.bt td{vertical-align:top}
.bt th{white-space:nowrap}
.bt .kv{grid-template-columns:150px 1fr;max-width:920px;margin:14px 0}
.bt .kv .ico{margin-right:4px}
.bt a.lnk{text-decoration:underline;text-underline-offset:3px}
/* 맨 위 세 줄 요약 */
.bt .sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;max-width:920px;margin:0 0 20px}
.bt .sc{background:var(--soft);border-radius:8px;padding:16px 18px}
.bt .sc i{display:block;font-style:normal;font-size:13px;color:var(--muted);margin-bottom:4px}
.bt .sc b{display:block;font-size:17px;font-weight:600;margin-bottom:8px}
.bt .sc span{font-size:14px;color:var(--muted)}
/* 단계 머리줄 · 질문 · 한 줄 답 */
.bt .lv{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:21px;font-weight:600;margin:60px 0 0;padding:0;border:0}
.bt .lv span{font-size:12px;font-weight:500;color:#fff;background:var(--fg);border-radius:3px;padding:2px 8px}
.bt .lv small{font-size:13px;font-weight:400;color:var(--muted);margin:0}
.bt .toc + .lv{margin-top:28px}
.bt .lv + h3{margin-top:22px;padding-top:0;border-top:0}
.bt .ans{font-size:17px;line-height:1.6;margin:0 0 16px}
/* 목차: 좁은 화면은 단계 칩 4개, 넓은 화면은 오른쪽에 붙어 따라오는 세로 목록 */
.bt .toc-in{display:flex;flex-wrap:wrap;gap:6px}
.bt .tj{padding:3px 10px;border:1px solid var(--line);border-radius:3px;cursor:pointer;font-size:14px}
.bt .tj.s{display:none}
@media(min-width:1100px){
  .bt{position:relative;padding-right:250px}
  .bt .toc{position:absolute;top:8px;right:0;bottom:0;width:210px}
  .bt .toc-in{position:sticky;top:76px;flex-direction:column;flex-wrap:nowrap;gap:0}
  .bt .tj{border:0;border-radius:0;color:var(--muted)}
  .bt .tj.s{display:block;border-left:2px solid var(--line);padding:4px 12px}
  .bt .tj.g{padding:16px 0 6px;font-size:13px;font-weight:500;color:var(--fg)}
  .bt .tj.g:first-child{padding-top:0}
  .bt .tj.s:hover{color:var(--fg);border-left-color:var(--fg)}
}
/* 카드 묶음 */
.bt .sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:10px;margin:14px 0;max-width:920px}
.bt .sgrid.w{grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.bt .sgrid.f4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.bt .sgrid.w2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.bt .sbox{border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.bt .sbox i{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-bottom:2px}
.bt .sbox b{display:block;font-weight:600;margin-bottom:3px}
.bt .sbox small{font-weight:400;font-size:12px;color:var(--muted);margin-left:4px}
.bt .sbox > span{display:block;font-size:14px;line-height:1.6}
.bt .sbox em{display:block;font-style:normal;font-size:13px;color:var(--muted);margin-top:8px}
.bt .sbox em .t{margin:0 2px}
.bt .steps{display:grid;grid-template-columns:auto 40px minmax(60px,1fr);gap:8px 14px;align-items:center;max-width:680px;margin:12px 0 14px}
.bt .steps b{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.bt .fx{background:var(--soft);border-radius:6px;padding:12px 16px;margin:12px 0;max-width:920px;line-height:1.8}
.bt .tri{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:10px 0}
.bt .tri .t{margin:0}
.bt .mvx{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;border:1px solid var(--line);border-radius:6px;padding:10px 14px;max-width:920px;margin:10px 0}
.bt .mvx b{font-weight:600}
.bt .mvx .t{margin:0}
.bt .mvx span:not(.t){font-size:14px;color:var(--muted)}
/* 부록: 접어 두는 참고 자료 */
.bt .ref{margin:0;border-top:1px solid var(--line)}
.bt .lv + .ref{margin-top:20px}
.bt .ref > summary{font-size:17px;color:var(--fg);padding:14px 0}
.bt .ref[open]{padding-bottom:20px}
.bt .ref > summary .muted{font-size:13px;margin-left:8px}
.guide.bt .rk{max-width:560px}
.bt .rk td{text-align:center;color:var(--muted);font-size:13px;padding:7px 2px}
.bt .rk th{padding:7px 8px 7px 0}
.bt .rk td b{color:var(--fg);font-size:15px;font-weight:600}
.bt .rk th{border-bottom:1px solid var(--soft)}
.bt h4 small{font-size:13px;font-weight:400;color:var(--muted);margin-left:6px}
/* 관장 위치 탭 (카드 · 한 줄 답은 배틀 기초 탭 스타일을 같이 씀) */
@media(min-width:1100px){.bt.gy{padding-right:0}}
.gy .gt tbody tr{cursor:pointer}
.gy .gt td{vertical-align:middle}
.gy .gt .ico{margin-right:5px}
.gy .gt td:nth-child(2),.gy .gt td:last-child{white-space:nowrap}
@media(max-width:700px){.gy .gt .glv,.gy .gt .ben{display:block}.gy .gt th,.gy .gt td{padding-left:5px;padding-right:5px}}
.gy .gt .badge,.gy .gym .badge{margin-left:0}
.gy code{background:var(--soft);border-radius:3px;padding:2px 6px;font-size:13px;overflow-wrap:anywhere}
.gy .gym{display:grid;gap:14px 36px;max-width:1040px;padding:26px 0 10px;border-top:1px solid var(--line);scroll-margin-top:70px}
.gy h3 + .gym{border-top:0;padding-top:4px}
.gy .gym h4{font-size:18px;margin:0 0 14px}
.gy .gym h4 small{margin-left:10px}
.gy .gym .kv{grid-template-columns:76px minmax(0,1fr);gap:12px 14px;max-width:none;margin:0}
.gy .gym .tgrid{margin:0;align-content:start}
.gy .gy-t{font-size:14px;margin-bottom:8px}
.gy .gy-t .t{margin:1px 2px}
.gy .mon-chip small{color:var(--muted)}
@media(min-width:900px){.gy .gym{grid-template-columns:minmax(0,1fr) 290px}}
/* 전설 포켓몬 탭 (요약 카드 · 한 줄 답 · 목차는 배틀 기초 탭 스타일을 같이 씀). 항목은 접힌 줄 = 이름 | 구조물 | 소환 아이템 */
.lgd h3 small{font-size:13px;font-weight:400;margin-left:8px}
.lgd .lg-list{max-width:1040px;border-bottom:1px solid var(--line);margin-top:14px}
.lgd details.lg{margin:0;border-top:1px solid var(--line);scroll-margin-top:70px}
.lgd .lg > summary{display:flex;align-items:center;gap:4px 14px;padding:9px 0;color:var(--fg)}
.lgd .lg > summary:hover{background:var(--soft)}
.lgd .lg-n{flex:0 0 250px;display:flex;align-items:center;min-width:0}
.lgd .lg-n img,.lgd .lg-w td img{width:36px;height:36px;margin:-6px 2px -6px -4px;image-rendering:pixelated;flex:none;vertical-align:middle}
.lgd .lg-n b{font-weight:600}
.lgd .lg-p{flex:1 1 0;min-width:0;font-size:14px}
.lgd .lg-i{flex:0 0 220px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lgd .lg-b{display:grid;gap:14px 36px;padding:6px 0 26px 16px}
.lgd .lg-b .kv{grid-template-columns:84px minmax(0,1fr);gap:12px 14px;max-width:none;margin:0;align-self:start;align-content:start}
.lgd .lg-b ul,.lgd .lg-b ol{margin:0;padding-left:20px}
.lgd .lg-b li{line-height:1.7;max-width:none}
.lgd .lg-b li + li,.lgd .lg-b dd > div + div{margin-top:4px}
.lgd .lg-b .tgrid{margin:0;align-content:start}
.lgd .lg-b details{margin:0}
.lgd .lg-b details table{max-width:420px}
.lgd b.clk{font-weight:500;white-space:nowrap}
.lgd b.clk .ico{margin-right:3px}
.lgd code{background:var(--soft);border-radius:3px;padding:2px 6px;font-size:13px;overflow-wrap:anywhere}
.lgd .badge{margin-left:0}
.lgd .lg-w{max-width:920px}
.lgd .lg-w tr.clk:hover td{background:var(--soft)}
.lgd .mon-chips{max-width:920px}
@media(min-width:1000px){.lgd .lg-b{grid-template-columns:minmax(0,1fr) 290px}}
@media(max-width:700px){
  .lgd .lg > summary{flex-wrap:wrap}
  .lgd .lg-n{flex:1 1 calc(100% - 34px)}
  .lgd .lg-p,.lgd .lg-i{flex:1 1 100%;padding-left:20px;font-size:13px;color:var(--muted)}
  .lgd .lg-b{padding-left:0}
  .lgd .lg-w th,.lgd .lg-w td{padding-left:4px;padding-right:4px;font-size:13px}
  .lgd .lg-w td b{display:inline-block}
}
/* nav */
.nav{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.nav-in{max-width:1280px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.nav a{flex:none;padding:14px 12px 12px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.nav a.on{color:var(--fg);border-bottom-color:var(--fg)}
.nav .brand{color:var(--fg);font-weight:600;padding-left:0;margin-right:12px}
.ver{color:var(--muted);font-size:13px;margin-top:40px;border-top:1px solid var(--line);padding-top:12px}
/* tab pages */
.tab-head{margin:0 0 6px;font-size:22px;font-weight:600}
.tab-desc{color:var(--muted);margin:0 0 24px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.filters input[type=text],.filters select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}
.filters input[type=text]{flex:1;min-width:180px}
.filters label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer}
.chip.sm{font-size:13px;padding:2px 9px}
.list .it{border-bottom:1px solid var(--soft)}
.list .it-h{display:grid;gap:10px;align-items:center;padding:9px 10px;cursor:pointer}
.list .it-h:hover{background:var(--soft)}
.list .it-b{padding:10px 14px 20px;display:none}
.list .it.open{box-shadow:inset 2px 0 0 var(--fg)}
.list .it.open > .it-h{background:var(--soft);font-weight:500}
.list .it-b > p:first-child{margin-top:4px}
.list .it.open .it-b{display:block}

<body>
<nav class="nav"><div class="nav-in">
  <a class="brand" href="#">코블몬 도감</a>
  <a data-tab="" href="#">도감</a><a data-tab="spawn" href="#/spawn">출현</a><a data-tab="moves" href="#/moves">기술</a><a data-tab="abilities" href="#/abilities">특성</a><a data-tab="items" href="#/items">아이템</a><a data-tab="types" href="#/types">상성표</a><a data-tab="guide" href="#/guide">가이드</a><a data-tab="calc" href="#/calc">계산기</a><a data-tab="battle" href="#/battle">배틀 기초</a><a data-tab="gym" href="#/gym">관장 위치</a><a data-tab="legend" href="#/legend">전설 포켓몬</a>
</div></nav>
<div class="wrap">
  <div class="search" id="dexbar">
    <input id="q" placeholder="포켓몬 이름 (한글/영문/도감번호)" autocomplete="off" autofocus>
    <div class="drop" id="drop"></div>
  </div>
  <div id="view"><p class="hint">예: 리자몽, 이브이, charizard, 6</p></div>
  <div class="ver" id="ver"></div>
</div>
<script src="data.js"></script>
<script>
const D = window.DEX, M = D.mons, MV = D.moves, TK = D.types;
// 즐겨찾기: 이 브라우저(localStorage)에만 저장. 사이트 주소마다 따로
let FAV = []; try { FAV = JSON.parse(localStorage.getItem("dex-fav") || "[]").filter(k => M[k]); } catch {}
const favLabel = k => FAV.includes(k) ? "★ 즐겨찾기" : "☆ 즐겨찾기";
const homeHtml = () => `<p class="hint">예: 리자몽, 이브이, charizard, 6</p><section style="margin-top:36px"><h2>즐겨찾기</h2>${FAV.length ? `<div class="mon-chips">${FAV.map(monChip).join("")}</div>` : '<p class="hint">포켓몬 페이지에서 이름 옆 ☆ 즐겨찾기를 누르면 여기에 모임. 이 브라우저에만 저장됨.</p>'}</section>`;
const TYPES = Object.keys(TK);
const COLOR = {normal:'#9fa19f',fire:'#e56c2b',water:'#3f8fd8',electric:'#e8b81e',grass:'#5fa83a',ice:'#59b9c8',fighting:'#c0392b',poison:'#9b5ab5',ground:'#b8893a',flying:'#8aa2e0',psychic:'#e06098',bug:'#8fa31b',rock:'#a89a6b',ghost:'#6a5a9c',dragon:'#5a4fcf',dark:'#5a4a42',steel:'#7f8fa0',fairy:'#e09ac0'};
// attacker -> {defender: mult}; omitted = 1
const CH = {
 normal:{rock:.5,steel:.5,ghost:0},
 fire:{grass:2,ice:2,bug:2,steel:2,fire:.5,water:.5,rock:.5,dragon:.5},
 water:{fire:2,ground:2,rock:2,water:.5,grass:.5,dragon:.5},
 electric:{water:2,flying:2,electric:.5,grass:.5,dragon:.5,ground:0},
 grass:{water:2,ground:2,rock:2,fire:.5,grass:.5,poison:.5,flying:.5,bug:.5,dragon:.5,steel:.5},
 ice:{grass:2,ground:2,flying:2,dragon:2,fire:.5,water:.5,ice:.5,steel:.5},
 fighting:{normal:2,ice:2,rock:2,dark:2,steel:2,poison:.5,flying:.5,psychic:.5,bug:.5,fairy:.5,ghost:0},
 poison:{grass:2,fairy:2,poison:.5,ground:.5,rock:.5,ghost:.5,steel:0},
 ground:{fire:2,electric:2,poison:2,rock:2,steel:2,grass:.5,bug:.5,flying:0},
 flying:{grass:2,fighting:2,bug:2,electric:.5,rock:.5,steel:.5},
 psychic:{fighting:2,poison:2,psychic:.5,steel:.5,dark:0},
 bug:{grass:2,psychic:2,dark:2,fire:.5,fighting:.5,poison:.5,flying:.5,ghost:.5,steel:.5,fairy:.5},
 rock:{fire:2,ice:2,flying:2,bug:2,fighting:.5,ground:.5,steel:.5},
 ghost:{psychic:2,ghost:2,dark:.5,normal:0},
 dragon:{dragon:2,steel:.5,fairy:0},
 dark:{psychic:2,ghost:2,fighting:.5,dark:.5,fairy:.5},
 steel:{ice:2,rock:2,fairy:2,fire:.5,water:.5,electric:.5,steel:.5},
 fairy:{fighting:2,dragon:2,dark:2,fire:.5,poison:.5,steel:.5},
};
const eff = (atk, defs) => defs.reduce((p, d) => p * (CH[atk][d] ?? 1), 1);
const tchip = (t, sm) => `<span class="t${sm ? ' sm' : ''}" style="background:${COLOR[t]}">${TK[t]}</span>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CAT = {P:'물리', S:'특수', T:'변화'};
const STAT = ['HP','공격','방어','특공','특방','스피드'];
const fullKo = m => m.ko + (m.form ? ` (${m.form})` : '');

// ---------- search ----------
const norm = s => s.toLowerCase().replace(/[\s\-.'’:]/g, '');
const IDX = D.order.map(k => ({k, m: M[k], ko: norm(fullKo(M[k])), en: norm(M[k].en + (M[k].form || ''))}));
function search(q) {
  q = norm(q); if (!q) return [];
  if (/^\d+$/.test(q)) return IDX.filter(x => x.m.n === +q).slice(0, 12);
  const hit = IDX.filter(x => x.ko.includes(q) || x.en.includes(q));
  const rank = x => (x.ko === q || norm(x.m.en) === q ? 0 : x.ko.startsWith(q) || x.en.startsWith(q) ? 1 : 2) * 2 + (x.m.form ? 1 : 0);
  return hit.sort((a, b) => rank(a) - rank(b) || a.m.n - b.m.n).slice(0, 12);
}
const $q = document.getElementById('q'), $drop = document.getElementById('drop'), $view = document.getElementById('view');
function bindSearch(input, drop, onPick) {
  let res = [], sel = 0;
  const show = () => {
    drop.innerHTML = res.map((x, i) => `<div data-k="${x.k}" class="${i === sel ? 'sel' : ''}"><span class="n">#${x.m.n}</span><span>${esc(fullKo(x.m))}</span><span class="en">${esc(x.m.en)}</span></div>`).join('');
    drop.classList.toggle('on', res.length > 0);
  };
  input.addEventListener('input', () => { res = search(input.value); sel = 0; show(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, res.length - 1); show(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); show(); e.preventDefault(); }
    else if (e.key === 'Enter' && res[sel]) onPick(res[sel].k);
    else if (e.key === 'Escape') drop.classList.remove('on');
  });
  drop.addEventListener('mousedown', e => { const d = e.target.closest('[data-k]'); if (d) onPick(d.dataset.k); });
}
bindSearch($q, $drop, go);
document.addEventListener('click', e => { if (!e.target.closest('.search')) document.querySelectorAll('.drop').forEach(d => d.classList.remove('on')); });
// URL: #내포켓몬 또는 #내포켓몬~상대포켓몬
let CUR = null, OPP = null;
function go(k) { location.hash = k + (OPP ? '~' + OPP : ''); }
function setOpp(o) { location.hash = CUR + (o ? '~' + o : ''); }
// #포켓몬[~상대]  또는  #/탭
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const tab = h.startsWith('/') ? h.slice(1).split('?')[0] : '';
  document.querySelectorAll('.nav a[data-tab]').forEach(a => a.classList.toggle('on', a.dataset.tab === tab));
  document.getElementById('dexbar').style.display = tab ? 'none' : '';
  if (tab) { (TABS[tab] || TABS.guide)(); window.scrollTo(0, 0); return; }
  const [me, opp] = h.split('~'); OPP = opp && M[opp] ? opp : null;
  render(me);
}
window.addEventListener('hashchange', route);

// ---------- evolution family ----------
function root(k) { const seen = new Set(); while (M[k].pre && M[M[k].pre] && !seen.has(k)) { seen.add(k); k = M[k].pre; } return k; }
function tree(k, seen = new Set()) {
  seen.add(k);
  const kids = {};
  for (const e of M[k].evos) { if (seen.has(e.to)) continue; (kids[e.to] ??= []).push(e.how); }
  return {k, kids: Object.entries(kids).map(([to, hows]) => ({how: hows.length > 2 ? hows[0] + ` 외 ${hows.length - 1}가지` : hows.join(' / '), node: tree(to, seen)}))};
}
function evoHtml(t, cur) {
  const m = M[t.k];
  const node = `<div class="node ${t.k === cur ? 'cur' : ''}" data-go="${t.k}"><img loading="lazy" src="${sprite(m.n)}" alt="" onerror="this.style.visibility='hidden'"><div class="ko">${esc(m.ko)}</div>${m.form ? `<div class="fm">${esc(m.form)}</div>` : ''}<div class="ty">${m.types.map(x => tchip(x, 1)).join('')}</div></div>`;
  if (!t.kids.length) return `<div class="evo">${node}</div>`;
  return `<div class="evo">${node}<div class="branches">${t.kids.map(c => `<div class="branch"><div class="how">${esc(c.how)}</div>${evoHtml(c.node, cur)}</div>`).join('')}</div></div>`;
}

// ---------- role ----------
// ponytail: 종족값만 보는 분류. 내구는 sqrt(HP×방어)로 공격과 같은 스케일에 놓고 비교
function role(stats) {
  const [hp, atk, def, spa, spd, spe] = stats, avg = stats.reduce((a, b) => a + b) / 6;
  const off = Math.max(atk, spa), bulk = Math.max(Math.sqrt(hp * def), Math.sqrt(hp * spd));
  let main;
  if (off >= bulk * 1.15) main = atk >= spa * 1.15 ? '물리 공격형' : spa >= atk * 1.15 ? '특수 공격형' : '양쪽 공격형';
  else if (bulk >= off * 1.15) main = def >= spd * 1.15 ? '물리 방어형' : spd >= def * 1.15 ? '특수 방어형' : '양쪽 방어형';
  else main = '균형형';
  const tags = [];
  if (spe >= 100 || spe >= avg * 1.25) tags.push('빠름'); else if (spe <= 45 || spe <= avg * 0.6) tags.push('느림');
  if (hp >= avg * 1.35) tags.push('HP 높음');
  const pick = (f, dir) => stats.map((v, i) => [v, i]).filter(([v]) => f(v)).sort((a, b) => dir * (b[0] - a[0])).map(([, i]) => STAT[i]);
  return {main, tags, hi: pick(v => v >= avg * 1.15, 1), lo: pick(v => v <= avg * 0.75, -1)};
}

function spawnSection(k, m) {
  const list = SP_BY[k] || [];
  let note = '';
  if (m.fossil) note += `<p class="lead">화석 복원: <b>${m.fossil.map(esc).join(', ')}</b> → 화석 분석기·복원 탱크에 넣어 되살림</p>`;
  if (!list.length) {
    // 변신 폼이면 기본 폼으로, 아니면 진화 전으로 링크

    note += m.fossil ? '' : `<p class="lead">${esc(noSpawnReason(k))}${pre ? ` <b class="lnk" data-go="${to}" style="cursor:pointer;text-decoration:underline">${esc(fullKo(pre))} 보기</b>` : ''}${lgOf(k) ? ` <a href="#/legend?${lgOf(k).id}" style="text-decoration:underline">만나는 법 보기</a>` : ''}</p>`;

}

const LEARN = {}; // move -> [[mon, how]]
function learners(id) {
  if (LEARN[id]) return LEARN[id];
  const out = [];
  for (const k of D.order) {
    const m = M[k];
    const lv = m.lv.find(x => x[1] === id);
    const how = lv ? `Lv.${lv[0]}` : m.tm.includes(id) ? 'TM' : m.tutor.includes(id) ? '가르침' : m.egg.includes(id) ? '알 기술' : null;
    if (how) out.push([k, how]);
  }
  return (LEARN[id] = out);
}

// ---- 관장 위치: 체육관이 생기는 바이옴 · 탐색 아이템 · 팀 (코블벌스 관동, build.js의 gyms) ----
TABS.gym = () => {
  const G = D.gyms, nm = k => esc(D.items[k]?.[0] || k), top = t => Math.max(...t.map(p => p[1]));
  const lvOf = g => g.tr.length > 1 ? `${top(g.tr[0][1])}~${top(g.tr.at(-1)[1])}` : top(g.tr[0][1]);
  const where = g => `${g.dim ? `<span class="badge">${g.dim}</span> ` : ''}${esc(g.bi)} <span class="muted ben">${esc(g.en)}${g.at ? ' · ' + esc(g.at) : ''}</span>`;
  const mon = ([k, lv]) => M[k] ? monChip(k).replace(/<\/span>$/, ` <small>Lv ${lv}</small></span>`) : `<span class="mon-chip">${esc(k)} <small>Lv ${lv}</small></span>`;
  // 팀의 절반 이상이 가진 타입 = 주 타입. 그 타입에 2배로 들어가는 공격 타입을 같이 보여줌 (팀이 섞여 있으면 생략)
  const hint = team => {
    const c = {}; team.forEach(([k]) => (M[k]?.types || []).forEach(t => c[t] = (c[t] || 0) + 1));
    const t = Object.keys(c).sort((a, b) => c[b] - c[a])[0];
    return t && c[t] * 2 >= team.length ? `<div class="gy-t">${tchip(t, 1)} 타입 위주 <span class="muted">→ 2배로 들어가는 기술</span> ${TYPES.filter(a => CH[a]?.[t] === 2).map(a => tchip(a, 1)).join('')}</div>` : '';
  };
  const box = (n, t, d) => `<div class="sbox"><i>${n}</i><b>${t}</b><span>${d}</span></div>`;
  // 받침 있으면 a, 없으면 b를 붙임 (은/는, 을/를)
  const josa = (w, a, b) => { const c = w.charCodeAt(w.length - 1) - 0xAC00; return w + (c >= 0 && c < 11172 && c % 28 ? a : b); };
  const TABLE_FOR = ['오버월드 체육관용', '네더 체육관용 (네더에 놓고 사용)', '엔드의 리그용 (엔드에 놓고 사용)'];
  $view.innerHTML = `<div class="guide bt gy"><h1 class="tab-head">관장 위치</h1><p class="tab-desc">관동 지방 관장 ${G.filter(g => g.tr.length === 1).length}명과 포켓몬 리그를 찾는 법. 관장은 돌아다니지 않고 체육관 건물 안에 있어요. 체육관은 정해진 바이옴에만 생기고, 좌표는 월드마다 달라요.</p>

  <h3>한눈에 보기</h3>
  <table class="gt"><thead><tr><th>순서</th><th>관장</th><th>체육관이 생기는 곳</th><th>탐색 아이템</th></tr></thead><tbody>
    ${G.map((g, i) => `<tr data-jump="gy-${i}"><td>${g.tr.length > 1 ? '끝' : i + 1}</td><td><b>${esc(g.ko)}</b> <span class="muted glv">Lv ${lvOf(g)}</span></td><td>${where(g)}</td><td>${ico(g.it)}${nm(g.it)}</td></tr>`).join('')}
  </tbody></table>
  <p class="desc" style="margin-top:10px">줄을 누르면 그 관장 정보로 이동해요. Lv는 그 관장이 쓰는 포켓몬의 최고 레벨이에요. 관장은 순서대로만 도전할 수 있어요.</p>

  <h3>찾는 법</h3>
  <p class="ans">관장마다 "탐색 아이템"이 있어요. 그걸 지도 제작대에 넣으면 그 관장의 체육관 지도가 나와요.</p>
  <div class="sgrid f4">
    ${box(1, '탐색 아이템 만들기', '다음 관장의 탐색 아이템을 조합해요. 조합법은 아래 관장별 정보에 있어요.')}
    ${box(2, '지도 제작대 놓기', `${josa(nm(D.gt[0]), '을', '를')} 만들어서 바닥에 놓고 우클릭해요.`)}
    ${box(3, '빈 지도와 같이 넣기', '빈 지도와 탐색 아이템을 넣고 잠깐 기다리면 체육관 지도가 나와요.')}
    ${box(4, '지도 따라가기', '지도에 찍힌 표시까지 가면 체육관이 있어요. 관장은 건물 안에 있어요.')}
  </div>
  <ul>
    <li>근처에 체육관이 없으면 "반경 ○○ 블록 이내에서 시설을 찾을 수 없습니다"라고 떠요. 그 관장의 바이옴 쪽으로 옮겨서 다시 해요.</li>
    <li>${G.filter(g => g.dim).map(g => `${g.tr.length > 1 ? josa(esc(g.ko), '은', '는') : esc(g.ko) + '의 체육관은'} ${g.dim}`).join(', ')}에 있어요. 그 차원에 가서 그 차원용 지도 제작대를 써야 해요.</li>
    <li>빈 지도는 조합대에서 나침반을 종이 8장으로 둘러싸서 만들어요.</li>
    <li>지도 제작대를 직업 없는 주민 옆에 두면 주민이 "관동지방 지도 안내인"이 돼요. 안내인에게 탐색 아이템과 빈 지도를 주고 지도를 받을 수도 있어요. 일부 마을에는 안내인이 이미 있어요.</li>
    <li>명령어 권한이 있으면 <code>/locate structure ${esc(G[0].st)}</code>처럼 쳐서 좌표를 바로 볼 수 있어요. 관장별 명령어는 아래에 있어요.</li>
  </ul>
  <h4>지도 제작대 만드는 법</h4>
  ${tcards(D.gt.map((k, i) => [k, TABLE_FOR[i]]))}

  <h3>관장별 정보</h3>
  ${G.map((g, i) => `<section class="gym" id="gy-${i}"><div>
    <h4>${g.tr.length > 1 ? '' : i + 1 + '. '}${esc(g.ko)}<small>${g.tr.length > 1 ? '사천왕 4명 + 챔피언' : esc(g.tr[0][0])} · 최고 Lv ${lvOf(g)}</small></h4>
    <dl class="kv">
      <dt>생기는 곳</dt><dd>${where(g)}</dd>
      <dt>명령어</dt><dd><code>/locate structure ${esc(g.st)}</code>${g.dim ? ` <span class="muted">${g.dim}에서 입력</span>` : ''}</dd>
      ${g.tr.map(([n, team]) => `<dt>${g.tr.length > 1 ? esc(n) : '포켓몬'}</dt><dd>${hint(team)}<div class="mon-chips">${team.map(mon).join('')}</div></dd>`).join('')}
    </dl>
  </div>${tcards([[g.it]])}</section>`).join('')}

  <h3>다음 지방</h3>
  <p>성도 · 호연 · 신오 지방은 관동 챔피언 ${josa(esc(G.at(-1).tr.at(-1)[0]), '을', '를')} 이긴 뒤에 열려요. 처음 한 명이 이기면 새 체육관이 추가되는데, 서버(월드)를 한 번 껐다 켜야 적용돼요.</p></div>`;
  $view.querySelector('.gt').addEventListener('click', e => { const j = e.target.closest('tr[data-jump]')?.dataset.jump; if (j) document.getElementById(j).scrollIntoView({behavior: 'smooth'}); });
};

// ---- 전설 포켓몬: 만나는 법 · 기믹 (build.js의 legends = legends.js에 구조물 바이옴·트레이너 레벨을 채운 것) ----
TABS.legend = () => {
  const L = D.legends, IT = D.items, nm = k => esc(IT[k]?.[0] || k);
  const chip = k => IT[k] ? `<b${itAttr(k, IT[k][0])}>${ico(k)}${nm(k)}</b>` : esc(k);
  // 낱말 끝에 받침이 있는지 (한글·숫자만 판단, 모르면 null)
  const bat = w => { const c = (w.match(/[가-힣0-9](?=[^가-힣0-9]*$)/) || [])[0]; return !c ? null : /\d/.test(c) ? '013678'.includes(c) : (c.charCodeAt(0) - 0xAC00) % 28 > 0; };
  const eul = w => bat(w) === null ? '을(를)' : bat(w) ? '을' : '를';
  // 본문의 {아이템 키} -> 누르면 얻는 법이 뜨는 아이템 이름. 뒤의 "을(를)"은 이름 받침에 맞춤
  const T = s => esc(s).replace(/\{([^}]+)\}(을\(를\))?/g, (m, k, j) => chip(k) + (j ? eul(IT[k]?.[0] || '') : ''));
  const where = w => `${w.dim ? `<span class="badge">${w.dim}</span> ` : ''}${esc(w.bi)}${w.en ? ` <span class="muted">${esc(w.en)}</span>` : ''}`;
  const TABLE = { 네더: 'lumymon:nether_cartography_table', 엔드: 'lumymon:end_cartography_table', '왜곡세계': 'lumymon:distortion_cartography_table' };
  const cmd = w => `<code>/locate structure ${esc(w.st)}</code>${w.dim ? ` <span class="muted">${w.dim}에서 입력</span>` : ''}`;
  const radar = (r, w) => `${chip(r)}${eul(IT[r]?.[0] || '')} 빈 지도와 함께 ${w.dim ? `${chip(TABLE[w.dim])}에 넣어요. ${w.dim}에 놓고 써야 해요.` : '지도 제작대에 넣어요.'}`;
  const names = e => e.mons.map(k => esc(fullKo(M[k]))).join(' · ');
  const box = (n, t, d) => `<div class="sbox"><i>${n}</i><b>${t}</b><span>${d}</span></div>`;
  const lv = (id, tag, t, note) => `<h2 class="lv" id="lg-${id}"><span>${tag}</span>${t}<small>${note}</small></h2>`;
  const TOC = [['a', '처음 볼 것', [['how', '소환하는 법'], ['find', '구조물 찾는 법']]], ['b', '구조물에서 소환', L.stages.map(([k, t]) => [k, t])], ['c', '다른 방법', [['wild', '야생 출현'], ['raid', '레이드 굴'], ['form', '폼 체인지 아이템']]]];

  const entry = e => {
    const cards = [...new Set([e.radar, ...(e.via || []).map(v => v[2]), ...e.need.map(n => n[0])])].filter(k => k && D.recipes[k]);
    const find = [e.w && (e.radar ? radar(e.radar, e.w) : '전용 레이더가 없어요. 이 바이옴을 돌아다니며 찾아요.'), e.w && cmd(e.w), e.find && T(e.find),
      ...(e.via || []).map(([n, w, r]) => `<span class="muted">먼저 갈 곳</span> <b>${esc(n)}</b> ${where(w)}<br>${chip(r)} · ${cmd(w)}`)].filter(Boolean);
    const rows = [
      ['어디서', `<b>${esc(e.place)}</b>${e.w ? `<br>${where(e.w)}` : ''}`],
      find.length && ['찾는 법', find.map(x => `<div>${x}</div>`).join('')],
      ['필요한 것', e.need.length ? `<ul>${e.need.map(([k, x]) => `<li>${chip(k)} <span class="muted">—</span> ${T(x)}</li>`).join('')}</ul>` : '소환 아이템이 필요 없어요.'],
      e.id === 'arceus' && ['플레이트', `<details><summary>플레이트 18장 위치 보기</summary><table><tbody>${L.plates.map(([k, w]) => `<tr><td>${chip(k)}</td><td>${esc(w)}</td></tr>`).join('')}</tbody></table></details>`],
      ['순서', `<ol>${e.steps.map(s => `<li>${T(s)}</li>`).join('')}</ol>`],
      (e.lv || e.shiny) && ['나오는 모습', [e.lv && `Lv ${esc(e.lv)}`, e.shiny && `이로치 ${esc(e.shiny)}`].filter(Boolean).join(' <span class="muted">·</span> ')],
      e.note && ['알아둘 것', `<ul>${e.note.map(s => `<li>${T(s)}</li>`).join('')}</ul>`],
      e.gim && ['폼 · 기믹', `<ul>${e.gim.map(([k, x]) => `<li>${chip(k)} <span class="muted">—</span> ${T(x)}</li>`).join('')}</ul>`],
      ['도감', `<div class="mon-chips">${e.mons.map(monChip).join('')}</div>`],

  };

  // 야생 출현: 출현 데이터에서 전설 계열만. 구조물 주변에서만 나오는 것(성도 3성수 등)은 위 목록에 있어서 뺌

  const FORM = [['mega_showdown:reveal_glass', '토네로스 · 볼트로스 · 랜드로스 · 러브로스를 영물폼으로 바꿔요.'], ['mega_showdown:dna_splicer', '큐레무를 레시라무나 제크로무와 합체시켜요 (화이트큐레무 · 블랙큐레무).'], ['mega_showdown:prison_bottle', '후파를 굴레를 벗어난 모습으로 바꿔요.'],
    ['mega_showdown:zygarde_cube'], ['mega_showdown:reassembly_unit'], ['mega_showdown:rusted_sword', '자시안에게 지니게 하면 검왕의 모습이 돼요.'], ['mega_showdown:rusted_shield', '자마젠타에게 지니게 하면 방패왕의 모습이 돼요.'],
    ['mega_showdown:wellspring_mask'], ['mega_showdown:hearthflame_mask'], ['mega_showdown:cornerstone_mask'], ['scroll_of_darkness'], ['scroll_of_waters']];
  const n = new Set(L.list.flatMap(e => e.mons.map(k => M[k].n))).size; // 폼이 달라도 같은 종은 한 번만 셈

  $view.innerHTML = `<div class="guide bt lgd"><h1 class="tab-head">전설 포켓몬</h1><p class="tab-desc">코블벌스에서 전설 · 환상의 포켓몬을 만나는 법이에요. 줄을 누르면 자세한 방법이 펼쳐져요.</p>
  <div class="sum">
    <div class="sc"><i>방법 1</i><b>구조물에서 불러내요</b><span>1~4세대 전설은 대부분 전용 구조물의 제단에 소환 아이템을 써서 만나요. ${n}종이 이 방법이에요.</span></div>

    <div class="sc"><i>방법 3</i><b>레이드 굴 보스로 나와요</b><span>7단계 레이드 보스를 쓰러뜨리면 Lv 100으로 잡을 기회가 생겨요.</span></div>
  </div>

    ${box(3, '제단에 쓰기', '아이템을 든 채 제단을 우클릭하면 포켓몬이 나타나요.')}

    <li>같은 포켓몬이 근처(약 60칸)에 이미 있으면 소환되지 않아요. 먼저 잡거나 쓰러뜨려요.</li>
    <li>레벨과 개체값은 소환할 때마다 무작위로 정해져요. 이로치는 대부분 2% 확률이에요.</li>
    <li>성도 · 호연 · 신오의 구조물은 그 지방이 열린 뒤 새로 만들어지는 땅에만 생겨요. 이미 다녀온 곳에는 없으니 멀리 나가야 해요.</li>
  </ul>
  <h3 id="lg-find">구조물은 어떻게 찾아요?</h3>
  <p class="ans">포켓몬별 레이더를 빈 지도와 함께 지도 제작대에 넣으면 구조물 지도가 나와요.</p>
  <ul>
    <li>지도 제작대 쓰는 법은 <a class="lnk" href="#/gym">관장 위치 탭</a>과 같아요. 오버월드 구조물은 어느 지방의 지도 제작대든 돼요.</li>
    <li>네더 · 엔드 · 왜곡세계의 구조물은 그 차원 전용 지도 제작대를 그 차원에 놓고 써야 해요.</li>
    <li>${chip('lumymon:battle_seeker')}를 같이 넣으면 가장 가까운 곳 말고 그다음 구조물을 찾아주고, 탐색 범위도 넓어져요. 이미 다녀온 구조물을 건너뛸 때 써요.</li>
    <li>레이더가 없는 구조물도 있어요. 그때는 바이옴을 돌아다니며 찾거나, 명령어 권한이 있으면 <code>/locate structure 구조물이름</code>을 써요. 구조물 이름은 아래 각 항목에 있어요.</li>
  </ul>
  <h4>레이더 재료와 차원별 지도 제작대</h4>
  ${tcards(L.common.map(k => [k]))}

  ${lv('b', '방법 1', '구조물에서 소환', '지방이 열리는 순서대로')}
  ${L.stages.map(([k, t, when, desc]) => `<h3 id="lg-${k}">${esc(t)} <small class="muted">${esc(when)}</small></h3><p>${esc(desc)}</p><div class="lg-list">${L.list.filter(e => e.s === k).map(entry).join('')}</div>`).join('')}

  ${lv('c', '방법 2 · 3', '다른 방법', '5세대 이후 전설')}
  <h3 id="lg-wild">야생에서는 누가 나와요?</h3>
  <p class="ans">아래 전설은 구조물 없이, 조건이 맞는 바이옴에서 그냥 나타나요.</p>
  <p>따로 적혀 있지 않으면 전부 "매우 희귀" 등급이라 오래 기다려야 해요. 줄을 누르면 도감으로 가요. <span class="badge" style="margin-left:0">레이드</span> 표시는 레이드 굴 보스로도 나온다는 뜻이에요.</p>
  ${wildTable(wild(['legendary', 'mythical']))}
  <details class="ref"><summary>울트라비스트 · 패러독스 포켓몬 <span class="muted">전설은 아니지만 비슷하게 드문 포켓몬</span></summary>${wildTable(wild(['ultra_beast', 'paradox']))}</details>

  <h3 id="lg-raid">레이드 굴은 어떻게 해요?</h3>
  <p class="ans">오버월드에 드물게 생기는 레이드 굴에서 보스를 쓰러뜨리면 그 포켓몬을 잡을 기회가 생겨요.</p>
  <ul>
    <li>굴의 단계는 1~7단계 중 무작위예요. 전설은 7단계에서만 나오고, 7단계 굴은 100개 중 2개꼴이에요.</li>
    <li>7단계 보스는 Lv 100이고 체력이 30배예요. 잡으면 Lv 100에 개체값 6개가 모두 최고예요.</li>
    <li>최대 4명이 같이 들어가고, 한 사람이 포켓몬 1마리만 써요. 준 피해가 전체의 16%를 넘어야 보상을 받아요.</li>
    <li>굴은 2시간마다 보스와 단계가 바뀌고, 그 사이 3번까지 깰 수 있어요.</li>
    <li>7단계 보스 중에서도 전설은 드물게 걸려요. 수치는 모드팩 기본 설정이라 서버마다 다를 수 있어요.</li>
  </ul>
  <h4>7단계 보스로 나오는 전설 · 환상</h4><div class="mon-chips">${(L.raid[7] || []).map(monChip).join('')}</div>
  <h4>6단계 보스로 나오는 울트라비스트 · 패러독스 <small class="muted">보스 Lv 90</small></h4><div class="mon-chips">${(L.raid[6] || []).map(monChip).join('')}</div>

  <h3 id="lg-form">모습을 바꾸는 아이템은 뭐가 있어요?</h3>
  <p class="ans">전설 중에는 아이템으로 모습이나 타입이 바뀌는 포켓몬이 많아요.</p>
  <p>구조물에서 소환하는 전설의 아이템(주홍구슬 · 큰백금옥 등)은 위 각 항목의 "폼 · 기믹"에 있어요. 아래는 야생 · 레이드로 만나는 전설의 아이템이에요. 이름을 누르면 얻는 법이 떠요.</p>
  ${tcards(FORM)}
  </div>`;
  $view.querySelector('.toc').addEventListener('click', e => {
    const el = document.getElementById(e.target.dataset.jump);
    if (el) el.scrollIntoView({behavior: 'smooth'});
  });
  // #/legend?articuno 처럼 들어오면 그 항목을 펼쳐서 보여줌 (도감 상세의 "만나는 법 보기")
  const open = document.getElementById('lg-' + (location.hash.split('?')[1] || ''));
  if (open && open.tagName === 'DETAILS') { open.open = true; setTimeout(() => open.scrollIntoView(), 0); } // 화면 전환 뒤 맨 위로 올리는 처리가 끝난 다음에 이동
};

// ---- 계산기: 만들 것 × 개수 -> 모을 재료 합계 ----
TABS.calc = () => {
  const $ = id => document.getElementById(id), cnt = s => +(s.match(/×(\d+)$/)?.[1] || 1);
  const NM = {}; Object.values(D.recipes).flat().forEach(r => r.ik.forEach((k, j) => NM[k] ??= r.i[j].replace(/ ×\d+$/, '')));
  const name = k => D.items[k]?.[0] || NM[k] || k;
  const cids = Object.keys(D.recipes).sort((a, b) => name(a).localeCompare(name(b)));
  // 중간 재료를 풀지: 모드 아이템만. 재료 한 가지짜리(광석→돌, 블록→조각, 사탕 합치기)는 거꾸로 가는 거라 안 풂
  const expand = (k, path) => { if (k.startsWith('minecraft:') || path.includes(k)) return null; const r = mainRecipes(k)[0], ks = [...new Set(r?.ik || [])]; return r && (ks.length > 1 || ks[0].startsWith('minecraft:')) ? r : null; };
  let list = (new URLSearchParams(location.hash.split('?')[1] || '').get('l') || '').split(',').map(s => s.split('*')).filter(([k]) => D.recipes[k]).map(([k, q]) => [k, Math.max(1, +q || 1)]);
  $view.innerHTML = `<h1 class="tab-head">계산기</h1><p class="tab-desc">만들 아이템과 개수를 넣으면 모아야 할 재료 합계. 한 번에 여러 개 나오는 조합(볼은 4개)은 조합 횟수를 올림해서 계산.</p>
  <div class="filters"><input type="text" id="cq" placeholder="만들 아이템 이름 또는 설명 키워드 (예: 몬스터볼, 철 배낭)">
  <label class="muted"><input type="checkbox" id="cd" checked> 배낭·기능 틀 같은 중간 재료도 풀기</label></div>
  <div class="list" id="cs" style="margin:-6px 0 18px"></div><div id="cr"></div><div id="co" style="margin-top:28px"></div>`;
  const save = () => history.replaceState(null, '', '#/calc' + (list.length ? '?l=' + list.map(x => x.join('*')).join(',') : ''));
  const run = () => {
    const raw = new Map(), made = new Map(), left = new Map(), deep = $('cd').checked;
    const need = (k, q, nm, path) => {
      const use = Math.min(left.get(k) || 0, q); left.set(k, (left.get(k) || 0) - use); q -= use; if (!q) return;
      const r = path.length ? deep && expand(k, path) : mainRecipes(k)[0];
      if (!r) { const a = raw.get(nm) || [k, 0]; a[1] += q; return raw.set(nm, a); }
      const t = Math.ceil(q / r.n); left.set(k, left.get(k) + t * r.n - q);
      r.ik.forEach((ik, j) => need(ik, cnt(r.i[j]) * t, r.i[j].replace(/ ×\d+$/, ''), [...path, k]));
      const m = made.get(k) || [0, r]; m[0] += t; made.set(k, m);
    };
    list.forEach(([k, q]) => need(k, q, name(k), []));
    $('co').innerHTML = list.length ? `<div class="mu"><div><h3>모을 재료</h3>${[...raw].map(([nm, [k, q]]) => `<div class="crow"><span${itAttr(k, nm)}>${ico(k)}${esc(nm)}</span><b>${q}</b></div>`).join('')}</div>
      <div><h3>조합 순서</h3>${[...made].map(([k, [t, r]]) => `<div class="crow"><span>${ico(k)}${esc(name(k))}</span><span class="muted">${esc(r.w)} ${t}번 → ${t * r.n}개${left.get(k) ? ` (${left.get(k)}개 남음)` : ''}</span></div>`).join('')}</div></div>` : '<p class="empty">위에서 만들 아이템을 고르면 여기에 재료가 나옴</p>';
  };
  const draw = () => { $('cr').innerHTML = list.map(([k, q], i) => `<div class="crow"><span>${ico(k)}${esc(name(k))}</span><span><input type="number" min="1" value="${q}" data-i="${i}"> 개 <button class="x" data-del="${i}">빼기</button></span></div>`).join(''); run(); };
  const add = k => { const x = list.find(y => y[0] === k); x ? x[1]++ : list.push([k, 1]); $('cq').value = ''; $('cs').innerHTML = ''; save(); draw(); };
  // 이름이 맞는 것 먼저, 그다음 설명만 맞는 것
  const hit = () => { const q = norm($('cq').value); return q ? cids.filter(k => qmatch(q, name(k), D.items[k]?.[2] || '')).sort((a, b) => !norm(name(a)).includes(q) - !norm(name(b)).includes(q)) : []; };
  $('cq').addEventListener('input', () => { $('cs').innerHTML = hit().map(k => `<div class="it" data-id="${k}"><div class="it-h" style="grid-template-columns:180px 90px 1fr"><span>${ico(k)}${esc(name(k))}</span><span class="muted">${esc(D.items[k]?.[1] || '')}</span><span class="muted">${esc(D.items[k]?.[2] || '')}</span></div></div>`).join('') || (norm($('cq').value) ? '<p class="empty">만들 수 있는 아이템 없음</p>' : ''); });
  $('cq').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing && hit()[0]) add(hit()[0]); });
  $('cs').addEventListener('click', e => { const it = e.target.closest('.it'); if (it) add(it.dataset.id); });
  $('cr').addEventListener('input', e => { const i = e.target.dataset.i; if (i == null) return; list[i][1] = Math.max(1, +e.target.value || 1); save(); run(); });
  $('cr').addEventListener('click', e => { const i = e.target.dataset.del; if (i == null) return; list.splice(i, 1); save(); draw(); });
  $('cd').addEventListener('change', run);
  draw();
};

document.getElementById('ver').textContent =`데이터: ${D.cfg.version} 인스턴스의 모드·데이터팩 파일 (기술 수치는 Pokémon Showdown). 서버 설정이나 추가 데이터팩에 따라 다를 수 있음.`;
route();
</script>
